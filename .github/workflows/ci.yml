# Runs on every push and pull request. Needs no secrets: the database tests
# use a throwaway Postgres in the runner, never a real Supabase project.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (types, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  database:
    name: Database security tests (pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Postgres 16 + PostGIS + pgTAP straight from Ubuntu's packages on the
      # runner (the postgis Docker image is built on Debian bullseye, whose
      # package mirror no longer serves pgTAP).
      - name: Install and start Postgres 16 with PostGIS and pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-16-postgis-3 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"
      - run: ./scripts/db-test.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Run from the functions folder so its deno.json applies (npm packages
      # from Deno's cache, not the app's node_modules).
      - run: deno check */index.ts
        working-directory: supabase/functions
      - run: deno test
        working-directory: supabase/functions
